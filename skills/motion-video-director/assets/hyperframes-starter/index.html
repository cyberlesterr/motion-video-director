<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Motion Video Director Starter</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #10151d;
        --paper: #f4f0e8;
        --signal: #c9ff3d;
        --muted: #9aa5b5;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; background: var(--ink); }

      [data-composition-id="motion-starter"] {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        color: var(--paper);
        background:
          radial-gradient(circle at 84% 14%, rgba(201, 255, 61, 0.16), transparent 20%),
          var(--ink);
        font-family: "Space Grotesk", Arial, sans-serif;
      }

      .scene-content {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        padding: 108px 144px;
      }

      .eyebrow {
        color: var(--muted);
        font-family: "IBM Plex Mono", monospace;
        font-size: 26px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .headline {
        width: 1180px;
        margin: 0;
        font-size: 132px;
        font-weight: 600;
        letter-spacing: -0.07em;
        line-height: 0.9;
      }

      .headline span { color: var(--signal); }

      .system {
        position: absolute;
        right: 144px;
        bottom: 118px;
        width: 1030px;
        height: 420px;
      }

      .rail {
        position: absolute;
        left: 0;
        right: 0;
        top: 204px;
        height: 2px;
        background: rgba(244, 240, 232, 0.3);
      }

      .fragment, .destination {
        position: absolute;
        top: 153px;
        width: 102px;
        height: 102px;
        border: 2px solid var(--paper);
        border-radius: 50%;
        background: var(--ink);
      }

      .fragment::after {
        position: absolute;
        top: 33px;
        left: 33px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--paper);
        content: "";
      }

      .destination {
        right: 0;
        border-color: var(--signal);
        background: var(--signal);
        box-shadow: 0 0 0 16px rgba(201, 255, 61, 0.11);
      }

      .destination::after {
        position: absolute;
        top: 25px;
        left: 25px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--ink);
        content: "";
      }

      #fragment-a { left: 40px; }
      #fragment-b { left: 250px; }
      #fragment-c { left: 460px; }

      .caption {
        position: absolute;
        right: 0;
        bottom: 0;
        color: var(--muted);
        font-family: "IBM Plex Mono", monospace;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div
      data-composition-id="motion-starter"
      data-start="0"
      data-duration="8"
      data-track-index="0"
      data-width="1920"
      data-height="1080"
    >
      <div class="scene-content">
        <div class="eyebrow">Motion thesis / 01</div>
        <h1 class="headline">Turn fragments into <span>momentum.</span></h1>
      </div>

      <div class="system" aria-label="Fragments resolving into a destination">
        <div class="rail"></div>
        <div id="fragment-a" class="fragment"></div>
        <div id="fragment-b" class="fragment"></div>
        <div id="fragment-c" class="fragment"></div>
        <div id="destination" class="destination"></div>
        <div class="caption">state: resolved</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const timeline = gsap.timeline({paused: true});
      timeline
        .from(".eyebrow", {opacity: 0, y: 26, duration: 0.55, ease: "power2.out"}, 0.2)
        .from(".headline", {opacity: 0, y: 74, duration: 0.8, ease: "power4.out"}, 0.35)
        .from(".fragment", {opacity: 0, scale: 0.35, duration: 0.52, stagger: 0.14, ease: "back.out(1.6)"}, 1.25)
        .from(".rail", {scaleX: 0, transformOrigin: "left center", duration: 0.8, ease: "power3.inOut"}, 1.65)
        .to("#fragment-a", {x: 562, duration: 1.05, ease: "power2.inOut"}, 2.8)
        .to("#fragment-b", {x: 352, duration: 1.05, ease: "power2.inOut"}, 2.8)
        .to("#fragment-c", {x: 142, duration: 1.05, ease: "power2.inOut"}, 2.8)
        .to(".fragment", {opacity: 0, scale: 0.2, duration: 0.38, stagger: 0.06, ease: "power2.in"}, 3.86)
        .from("#destination", {opacity: 0, scale: 0.4, duration: 0.55, ease: "back.out(2)"}, 3.92)
        .from(".caption", {opacity: 0, y: 18, duration: 0.4, ease: "power2.out"}, 4.38);

      window.__timelines["motion-starter"] = timeline;
    </script>
  </body>
</html>
